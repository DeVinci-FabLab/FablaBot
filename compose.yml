services:
  python-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    container_name: fablabot-dev
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DISCORD_TOKEN_FILE=/run/secrets/discord_token
      - GUILD_TOKEN_FILE=/run/secrets/guild_token
      - PERSONAL_ID_FILE=/run/secrets/personal_id
    secrets:
      - discord_token
      - guild_token
      - personal_id
    command: uv run -m fablabot.main

  python-prod-local:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: fablabot-prod
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN_FILE=/run/secrets/discord_token
      - GUILD_TOKEN_FILE=/run/secrets/guild_token
      - PERSONAL_ID_FILE=/run/secrets/personal_id
    secrets:
      - discord_token
      - guild_token
      - personal_id
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  python-prod:
    image: ghcr.io/devinci-fablab/fablabot:latest
    container_name: fablabot-prod
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN_FILE=/run/secrets/discord_token
      - GUILD_TOKEN_FILE=/run/secrets/guild_token
      - PERSONAL_ID_FILE=/run/secrets/personal_id
    secrets:
      - discord_token
      - guild_token
      - personal_id
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ${VOLUMES_PATH}/fablabot/data:/app/data
      - ${VOLUMES_PATH}/fablabot/logs:/app/logs

secrets:
  discord_token:
    file: ./secrets/discord_token.secret
  guild_token:
    file: ./secrets/guild_token.secret
  personal_id:
    file: ./secrets/personal_id.secret
