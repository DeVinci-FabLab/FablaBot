name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions: {}

# One run at a time, so the release pull request and the image tags always end on the last push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag the release and push the release branch
      pull-requests: write # open, label and comment on the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Update the release pull request, or tag the release it merged
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  check-release-pr:
    name: check the release pull request
    needs: release
    if: ${{ needs.release.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # start ci.yml on the release branch
    steps:
      - name: Start the check on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$PR" | jq -r .headBranchName)
          case "$branch" in
            release-please--branches--*) ;;
            *) echo "Unexpected release branch: '$branch'" >&2; exit 1 ;;
          esac
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  build-and-push-image:
    name: build and push image
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the build date
        id: build-date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/devinci-fablab/fablabot:latest
            ghcr.io/devinci-fablab/fablabot:${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.build-date.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
