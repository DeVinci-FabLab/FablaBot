[project]
dependencies = [
  "discord-py>=2.7.1",
  "emoji>=2.15.0",
  "python-dotenv==1.0.0",
  "tzdata>=2025.2",
]
description = "General purpose Discord bot for the DeVinci Fablab discord server."
name = "fablabot"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[build-system]
requires = ["setuptools"]

[tool.setuptools.packages.find]
include = ["fablabot*"]
where = ["src"]

[project.scripts]
doc_builder = "fablabot._build_docs:build_docs"
main = "fablabot.main:main"

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "pdoc>=15.0.3",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "ruff>=0.12.9",
  "typing-extensions>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 128
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["COM812", "D105", "PTH123"]
select = [
  "ARG",
  "B",
  "C4",
  "COM",
  "D",
  "DTZ",
  "E",
  "F",
  "I",
  "N",
  "PGH",
  "PIE",
  "PLR",
  "PTH",
  "PYI",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  "TC",
  "TRY",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 128

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.basedpyright]
include = ["src", "tests"]
pythonPlatform = "Linux"
pythonVersion = "3.13"
typeCheckingMode = "standard"
