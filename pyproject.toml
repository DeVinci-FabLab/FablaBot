[project]
name = "fablabot"
version = "0.1.0"
description = "General purpose Discord bot for the DeVinci Fablab discord server."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["discord-py==2.5.2", "python-dotenv==1.0.0", "selenium==4.8.3", "webdriver-manager==3.8.5"]

[build-system]
requires = ["setuptools"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fablabot*"]

[project.scripts]
main = "fablabot.main:main"


[tool.ruff]
line-length = 128
[tool.ruff.format]
docstring-code-format = true
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.pycodestyle]
max-doc-length = 88
[tool.ruff.lint.isort]
force-sort-within-sections = true
